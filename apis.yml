name: Ekpa
description: Ekpa is an early-stage consumer fintech from Y Combinator's Summer 2026
  batch, building autonomous research agents for trading. The product connects to a
  user's brokerage accounts through SnapTrade and consolidates accounts, positions,
  news, and research into a single dashboard, with AI-generated position analysis
  grounded in news, analyst ratings, and SEC filings. Ekpa is research-and-education
  only and makes no buy or sell recommendations, leaving every decision to the user.
  As of this profile Ekpa publishes a single marketing site at goekpa.com and exposes
  no public developer API, documentation, SDKs, OpenAPI, or other machine-readable
  artifacts.
